<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fable 판례 검색기</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; }
      body { max-width: 760px; margin: 0 auto; padding: 32px 20px; color: #1f2937; }
      h1 { margin-bottom: 8px; }
      form { display: flex; gap: 8px; margin: 24px 0; }
      input { flex: 1; padding: 12px; font-size: 16px; }
      button { padding: 12px 18px; cursor: pointer; }
      #result { border-top: 1px solid #d1d5db; padding-top: 20px; min-height: 80px; }
      section { margin-top: 24px; }
      h2 { font-size: 20px; }
      h3 { margin-bottom: 4px; }
      .metadata, .notice, .empty, .disclaimer { color: #6b7280; }
      .case { border-bottom: 1px solid #e5e7eb; padding: 12px 0; }
      .case-detail p { white-space: pre-wrap; line-height: 1.6; }
      .law-label { font-weight: 600; }
      footer { margin-top: 40px; color: #6b7280; font-size: 13px; }
    </style>
  </head>
  <body>
    <h1>Fable 판례 검색기</h1>
    <p>법제처 국가법령정보 Open API 기반 검색 골격</p>
    <form id="ask-form">
      <input id="query" name="query" maxlength="10000" placeholder="사건번호 또는 법률 질문을 입력하세요" required>
      <button type="submit">검색</button>
    </form>
    <div id="result" aria-live="polite">질문을 입력해 주세요.</div>
    <footer>본 결과는 법제처 국가법령정보 Open API 데이터를 기반으로 하며, 법률 자문이 아닙니다.</footer>
    <script>
      const form = document.querySelector("#ask-form");
      const query = document.querySelector("#query");
      const result = document.querySelector("#result");

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        result.textContent = "법령센터 검색 중… (수 초 소요)";
        try {
          const response = await fetch("/ask", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ query: query.value }),
          });
          const payload = await response.json();
          if (payload.html) result.innerHTML = payload.html;
          else result.textContent = payload.message || JSON.stringify(payload, null, 2);
        } catch (error) {
          result.textContent = `요청 실패: ${error.message}`;
        }
      });
    </script>
  </body>
</html>
